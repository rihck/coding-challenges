name: Legal Case Tracker

on:
  schedule:
    - cron: '0 9 1,11,21 * *'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r legal-tracker/requirements.txt

      - name: Run tracker
        run: python legal-tracker/tracker.py
        env:
          CPF: ${{ secrets.CPF }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add legal-tracker/state/cases.json
          git diff --staged --quiet || git commit -m "chore: update case state [skip ci]"
          git push
